name: Alpha v1.0.0

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }} for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            qt-arch: win64_msvc2019_64
            artifact-name: ClipboardApp-windows.zip
          - os: macos-14
            platform: macos
            qt-arch: clang_64
            artifact-name: ClipboardApp-mac.dmg
          - os: ubuntu-22.04
            platform: android
            qt-arch: android_armv8
            artifact-name: ClipboardApp-android.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java (Android only)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK/NDK (Android only)
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '26.1.10909125'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          arch: ${{ matrix.qt-arch }}
          modules: 'qtconnectivity qt5compat'

      - name: Setup MSVC (Windows only)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Project (Windows & macOS)
        if: matrix.platform != 'android'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Build Project (Android only)
        if: matrix.platform == 'android'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DQT_HOST_PATH=$QT_ROOT_DIR
          cmake --build build --config Release
          cmake --build build --target apk

      - name: Deploy and Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./dist
          Copy-Item ./build/ClipboardApp.exe ./dist/
          windeployqt --qmldir . ./dist/ClipboardApp.exe
          Compress-Archive -Path ./dist/* -DestinationPath ./${{ matrix.artifact-name }}

      - name: Deploy and Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          macdeployqt ./build/ClipboardApp.app -dmg
          mv ./build/ClipboardApp.dmg ./${{ matrix.artifact-name }}

      - name: Deploy and Package (Android)
        if: matrix.platform == 'android'
        run: |
          find build -name "*.apk" -exec cp {} ./${{ matrix.artifact-name }} \;

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
