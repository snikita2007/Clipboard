name: Alpha v1.0.0

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            qt-arch: win64_msvc2019_64
            qt-target: desktop
            artifact-name: ClipboardApp-windows.zip
          - os: macos-14
            platform: macos
            qt-arch: clang_64
            qt-target: desktop
            artifact-name: ClipboardApp-mac.dmg
          - os: ubuntu-22.04
            platform: linux
            qt-arch: gcc_64
            qt-target: desktop
            artifact-name: ClipboardApp-linux.AppImage
          - os: ubuntu-22.04
            platform: android
            qt-arch: android
            qt-target: android
            artifact-name: ClipboardApp-android.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall
        run: pip install aqtinstall

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux' || matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libbluetooth-dev libpulse-dev ninja-build

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Qt via aqtinstall
        shell: bash
        run: |
          python -m aqt install-qt ${{ matrix.os == 'windows-2022' && 'windows' || (matrix.os == 'macos-14' && 'mac' || 'linux') }} ${{ matrix.qt-target }} 6.5.3 ${{ matrix.qt-arch }} -m qtconnectivity qt5compat --outputdir ${{ github.workspace }}/Qt
          echo "QT_ROOT_DIR=${{ github.workspace }}/Qt/6.5.3/${{ matrix.qt-arch }}" >> $GITHUB_ENV
          echo "${{ github.workspace }}/Qt/6.5.3/${{ matrix.qt-arch }}/bin" >> $GITHUB_PATH

      - name: Setup MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Project (Desktop)
        if: matrix.platform != 'android'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --config Release

      - name: Build Project (Android)
        if: matrix.platform == 'android'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DQT_HOST_PATH=$QT_ROOT_DIR
          cmake --build build --config Release
          cmake --build build --target apk

      - name: Deploy and Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./dist
          Copy-Item ./build/ClipboardApp.exe ./dist/
          windeployqt --qmldir . ./dist/ClipboardApp.exe
          Compress-Archive -Path ./dist/* -DestinationPath ./${{ matrix.artifact-name }}

      - name: Deploy and Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          macdeployqt ./build/ClipboardApp.app -dmg
          mv ./build/ClipboardApp.dmg ./${{ matrix.artifact-name }}

      - name: Deploy and Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo wget -O /usr/local/bin/linuxdeploy https://github.com
          sudo chmod +x /usr/local/bin/linuxdeploy
          export QMAKE=$QT_ROOT_DIR/bin/qmake
          linuxdeploy --plugin qt --executable ./build/ClipboardApp --output appimage
          mv ClipboardApp-x86_64.AppImage ./${{ matrix.artifact-name }}

      - name: Deploy and Package (Android)
        if: matrix.platform == 'android'
        run: |
          find build -name "*.apk" -exec cp {} ./${{ matrix.artifact-name }} \;

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-name }}
          tag_name: "v0.0.1"
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
