name: Alpha v1.0.0

on:
  release:
    types: [published]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            qt-arch: win64_msvc2019_64
            artifact-name: my-qt-app-windows.zip
          - os: ubuntu-24.04
            platform: linux
            qt-arch: gcc_64
            artifact-name: my-qt-app-linux.AppImage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt@v3
        with:
          version: '6.11.0'
          arch: ${{ matrix.qt-arch }}

      - name: Setup MSVC (Windows only)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Project (CMake)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Deploy and Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./dist
          Copy-Item ./build/clipboardapp.exe ./dist/
          windeployqt --qmldir . ./dist/clipboardapp.exe
          Compress-Archive -Path ./dist/* -DestinationPath ./${{ matrix.artifact-name }}

      - name: Deploy and Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo wget -O /usr/local/bin/linuxdeploy https://github.com
          sudo chmod +x /usr/local/bin/linuxdeploy
          export QMAKE=$QT_ROOT_DIR/bin/qmake
          linuxdeploy --plugin qt --executable ./build/clipboardapp --output appimage
          mv ClipboardApp-x86_64.AppImage ./${{ matrix.artifact-name }}

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
