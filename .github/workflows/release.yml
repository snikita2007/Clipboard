name: Alpha v1.0.0

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            qt-arch: win64_msvc2022_64
            qt-target: desktop
            artifact-name: ClipboardApp-windows.zip
          - os: macos-14
            platform: macos
            qt-arch: clang_64
            qt-target: desktop
            artifact-name: ClipboardApp-mac.dmg
          - os: ubuntu-22.04
            platform: linux
            qt-arch: linux_gcc_64
            qt-target: desktop
            artifact-name: ClipboardApp-linux.AppImage
          - os: ubuntu-22.04
            platform: android
            qt-arch: android_arm64_v8a
            qt-target: android
            artifact-name: ClipboardApp-android.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux' || matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libbluetooth-dev libpulse-dev ninja-build

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Qt (desktop host for Android)
        if: matrix.platform == 'android'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtconnectivity qt5compat qtshadertools'
          cache: true
          dir: ${{ github.workspace }}/Qt
          set-env: false

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          target: ${{ matrix.qt-target }}
          arch: ${{ matrix.qt-arch }}
          modules: 'qtconnectivity qt5compat qtshadertools'
          cache: true
          dir: ${{ github.workspace }}/Qt

      - name: Setup MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.4'

      - name: Build Project (Desktop)
        if: matrix.platform != 'android'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --config Release

      - name: Debug Qt paths (Android)
        if: matrix.platform == 'android'
        run: |
          echo "=== Qt root ==="
          ls ${{ github.workspace }}/Qt/ || echo "Qt dir missing"
          echo "=== Qt versions ==="
          ls ${{ github.workspace }}/Qt/6.9.0/ || echo "6.9.0 dir missing"

      - name: Build Project (Android)
        if: matrix.platform == 'android'
        env:
          QT_ANDROID_ROOT: ${{ github.workspace }}/Qt/Qt/6.9.0/android_arm64_v8a
          QT_HOST_ROOT: ${{ github.workspace }}/Qt/Qt/6.9.0/linux_gcc_64
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ANDROID_ROOT \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DQT_HOST_PATH=$QT_HOST_ROOT
          cmake --build build --config Release
          cmake --build build --target apk

      - name: Deploy and Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./dist
          Copy-Item ./build/ClipboardApp.exe ./dist/
          windeployqt --qmldir . ./dist/ClipboardApp.exe
          Compress-Archive -Path ./dist/* -DestinationPath ./${{ matrix.artifact-name }}

      - name: Deploy and Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          macdeployqt ./build/ClipboardApp.app -dmg
          mv ./build/ClipboardApp.dmg ./${{ matrix.artifact-name }}

      - name: Deploy and Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo wget -O /usr/local/bin/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          sudo wget -O /usr/local/bin/linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/linuxdeploy-plugin-qt
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp ./build/ClipboardApp AppDir/usr/bin/
          cp ui/assets/app.png AppDir/usr/share/icons/hicolor/256x256/apps/ClipboardApp.png
          cat > AppDir/usr/share/applications/ClipboardApp.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=ClipboardApp
          Exec=ClipboardApp
          Icon=ClipboardApp
          Type=Application
          Categories=Utility;
          DESKTOP
          export QMAKE=$QT_ROOT_DIR/bin/qmake
          export LD_LIBRARY_PATH=$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH
          linuxdeploy --appdir AppDir --plugin qt --output appimage
          mv ClipboardApp-x86_64.AppImage ./${{ matrix.artifact-name }}

      - name: Deploy and Package (Android)
        if: matrix.platform == 'android'
        run: |
          find build -name "*.apk" -exec cp {} ./${{ matrix.artifact-name }} \;

      - name: Upload Binaries to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-name }}
          tag_name: ${{ github.ref_name }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Binaries as Artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}